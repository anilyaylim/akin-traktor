# Test deployment to GitHub Pages (noindex, nofollow): https://anilyaylim.github.io/akin-traktor/
# Builds the dark site (/akin-traktor/) and the light v2 (/akin-traktor/light/) and publishes ./site to gh-pages.
name: Pages (test)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/build-all.sh
        env:
          BASE: /akin-traktor
          NEXT_TELEMETRY_DISABLED: 1
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
